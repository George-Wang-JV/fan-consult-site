<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>粉丝咨询中心</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <main id="authView" class="auth-shell">
    <section class="auth-card">
      <div class="brand">💬 区块透镜粉丝群</div>
      <p class="muted">注册后可进行一对一咨询，并申请加入粉丝交流群。</p>
      <div class="tabs">
        <button id="loginTab" class="tab active">登录</button>
        <button id="registerTab" class="tab">注册</button>
      </div>

      <form id="loginForm" class="form-stack">
        <label>邮箱<input name="email" type="email" required /></label>
        <label>密码<input name="password" type="password" required /></label>
        <button class="primary" type="submit">登录</button>
      </form>

      <form id="registerForm" class="form-stack hidden">
        <label>昵称<input name="nickname" maxlength="30" required /></label>
        <label>邮箱<input name="email" type="email" required /></label>
        <label>密码<input name="password" type="password" minlength="8" required /></label>
        <button class="primary" type="submit">创建账号</button>
      </form>
    </section>
  </main>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand small">💬 咨询中心</div>
      <div id="meCard" class="me-card"></div>
      <nav>
        <button data-page="home" class="nav-btn active">🏠 我的主页</button>
        <button data-page="direct" class="nav-btn">👤 一对一咨询 <span id="directUnread" class="unread-badge hidden"></span></button>
        <button data-page="groups" class="nav-btn">👥 粉丝交流群 <span id="groupUnread" class="unread-badge hidden"></span></button>
        <button id="adminBtn" data-page="admin" class="nav-btn hidden">🛡️ 管理后台</button>
      </nav>
      <button id="logoutBtn" class="ghost">退出登录</button>
    </aside>

    <section class="content">
      <header class="topbar">
        <button id="mobileMenu" class="ghost mobile-only">☰</button>
        <h1 id="pageTitle">我的主页</h1>
      </header>

      <div id="homePage" class="page">
        <div class="hero-card home-card">
          <p id="homeGreeting" class="home-greeting"></p>
          <p>私人群，说啥都行，没有审核。</p>
          <div class="hero-actions">
            <button class="primary" data-goto="direct">开始咨询</button>
            <button class="secondary" data-goto="groups">查看群聊</button>
            <button id="enableNotifications" class="secondary">🔔 开启新消息通知</button>
          </div>
          <p id="notificationStatus" class="notification-status muted" aria-live="polite">点击开启后，浏览器会请求通知权限。</p>
        </div>

        <div class="hero-card home-card referral-card">
          <h2>使用我的邀请码注册享受返佣！</h2>
          <div class="hero-actions">
            <a
              class="primary referral-button"
              href="https://partner.bitget.cafe/bg/Bitfk"
              target="_blank"
              rel="noopener noreferrer sponsored"
            >点我注册</a>
          </div>
        </div>
      </div>

      <div id="directPage" class="page hidden">
        <div class="chat-layout">
          <aside id="directContacts" class="contact-list"></aside>
          <section class="chat-panel">
            <div id="directHeader" class="chat-header">请选择联系人</div>
            <div id="directMessages" class="messages"></div>
            <form id="directForm" class="composer hidden">
              <div class="composer-tools" aria-label="更多发送方式">
                <button type="button" class="composer-tool" data-rich-action="image" data-scope="direct">📷 照片</button>
                <button type="button" class="composer-tool" data-rich-action="video" data-scope="direct">🎬 视频</button>
                <button type="button" class="composer-tool" data-rich-action="audio" data-scope="direct">🎤 语音</button>
                <button type="button" class="composer-tool" data-rich-action="location" data-scope="direct">📍 位置</button>
              </div>
              <div class="composer-main">
                <input id="directInput" maxlength="2000" placeholder="输入消息…" autocomplete="off" />
                <button class="primary" type="submit">发送</button>
              </div>
            </form>
          </section>
        </div>
      </div>

      <div id="groupsPage" class="page hidden">
        <div id="groupList" class="card-grid"></div>
        <section id="groupChat" class="chat-panel standalone hidden">
          <div id="groupHeader" class="chat-header"></div>
          <div id="pinnedMessage" class="pinned hidden"></div>
          <div id="groupMessages" class="messages"></div>
          <form id="groupForm" class="composer">
            <div class="composer-tools" aria-label="更多发送方式">
              <button type="button" class="composer-tool" data-rich-action="image" data-scope="group">📷 照片</button>
              <button type="button" class="composer-tool" data-rich-action="video" data-scope="group">🎬 视频</button>
              <button type="button" class="composer-tool" data-rich-action="audio" data-scope="group">🎤 语音</button>
              <button type="button" class="composer-tool" data-rich-action="location" data-scope="group">📍 位置</button>
            </div>
            <div class="composer-main">
              <input id="groupInput" maxlength="2000" placeholder="发送群消息…" autocomplete="off" />
              <button class="primary" type="submit">发送</button>
            </div>
          </form>
        </section>
      </div>

      <div id="adminPage" class="page hidden">
        <div class="admin-grid">
          <section class="panel">
            <h3>创建粉丝群</h3>
            <form id="createGroupForm" class="form-stack compact">
              <label>群名称<input name="name" maxlength="40" required /></label>
              <label>简介<textarea name="description" maxlength="200"></textarea></label>
              <button class="primary" type="submit">创建群聊</button>
            </form>
          </section>
          <section class="panel">
            <h3>群管理</h3>
            <div id="adminGroupList"></div>
          </section>
        </div>
        <section id="groupManagePanel" class="panel hidden">
          <h3 id="manageGroupTitle">群管理</h3>
          <div class="manage-columns">
            <div><h4>待审核申请</h4><div id="joinRequests"></div></div>
            <div><h4>群成员</h4><div id="groupMembers"></div></div>
          </div>
        </section>
      </div>
    </section>
  </div>

  <input id="mediaPicker" class="hidden" type="file" />
  <div id="messageActions" class="action-backdrop hidden" role="presentation">
    <section class="action-sheet" role="dialog" aria-modal="true" aria-label="消息操作">
      <div class="action-title">回应这条消息</div>
      <div class="reaction-picker">
        <button type="button" data-reaction="👍">👍</button>
        <button type="button" data-reaction="❤️">❤️</button>
        <button type="button" data-reaction="😂">😂</button>
        <button type="button" data-reaction="😮">😮</button>
        <button type="button" data-reaction="😢">😢</button>
        <button type="button" data-reaction="🙏">🙏</button>
      </div>
      <button id="recallMessage" type="button" class="action-row">↩️ 撤回（所有人不可见）</button>
      <button id="deleteMessage" type="button" class="action-row danger-text">🗑️ 删除（仅自己不可见）</button>
      <button id="closeMessageActions" type="button" class="action-row cancel-row">取消</button>
    </section>
  </div>

  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
    <div class="image-viewer-toolbar">
      <button id="imageZoomOut" type="button" aria-label="缩小图片">−</button>
      <span id="imageZoomLabel">100%</span>
      <button id="imageZoomIn" type="button" aria-label="放大图片">＋</button>
      <button id="imageZoomReset" type="button">适应屏幕</button>
      <button id="imageDownload" type="button">⬇ 下载</button>
      <button id="imageViewerClose" type="button" aria-label="关闭图片预览">✕</button>
    </div>
    <div id="imageViewerStage" class="image-viewer-stage">
      <img id="imageViewerImage" alt="聊天图片预览" />
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
